<div class="border border-base-300 rounded-lg p-3 bg-base-100 flex flex-col h-[30vh]">

  <!-- TOOLBAR RESPONSIVE -->
  <div class="flex flex-wrap gap-2 mb-2 border-b pb-2 items-center">

    <!-- FORMAT GROUP -->
    <div class="flex flex-wrap gap-2 items-center flex-1">

      <button class="btn btn-xs" [disabled]="!editor" (click)="toggleBold()">B</button>
      <button class="btn btn-xs" [disabled]="!editor" (click)="toggleItalic()">I</button>

      <button class="btn btn-xs" [disabled]="!editor" (click)="toggleBulletList()">• List</button>

      <button class="btn btn-xs btn-ghost" (click)="toggleTaskList()">☑</button>
      <button class="btn btn-xs btn-ghost" (click)="toggleOrderedList()">1.</button>

      <button class="btn btn-xs btn-ghost" (click)="toggleStrike()">S</button>
      <button class="btn btn-xs btn-ghost" (click)="toggleUnderline()">U</button>

      <button class="btn btn-xs btn-ghost" (click)="setLink()">🔗</button>
      <button class="btn btn-xs btn-ghost" (click)="unsetLink()">✖🔗</button>

    </div>

    <!-- COLOR + EMOJI GROUP -->
    <div class="flex gap-2 items-center ml-auto">

      <!-- COLOR -->
      <div class="dropdown dropdown-end">
        <label tabindex="0" class="btn btn-xs btn-ghost">🎨</label>

        <div tabindex="0" class="dropdown-content p-3 shadow bg-base-100 rounded-box">
          <input
            type="color"
            class="w-12 h-12 cursor-pointer"
            (input)="setColor($event.target.value)" />
        </div>
      </div>

      <!-- EMOJI -->
      <div class="relative">

        <button class="btn btn-xs" (click)="showEmojiPicker = !showEmojiPicker">
          😀
        </button>

        @if (showEmojiPicker) {
          <div class="absolute z-50 top-10 right-0 bg-base-100 shadow rounded-box">

            <emoji-picker (emoji-click)="addEmoji($event)"></emoji-picker>

          </div>
        }

      </div>

    </div>

  </div>

  <!-- EDITOR (SCROLL + RESPONSIVE) -->
  <div class="flex-1 overflow-y-auto editor-box">
    <div class="prose max-w-none h-full" #editorEl></div>
  </div>
</div>
