<div class="mb-5 w-72">
  <label class="block mb-1 text-sm font-medium text-gray-700">
    {{ label() }}
  </label>

  <div class="relative h-11 rounded-lg border border-gray-300 bg-white
              focus-within:ring-2 focus-within:ring-blue-500 focus-within:border-blue-500">

    <!-- INPUT -->
    <input
      #inputRef
      type="text"
      (input)="onInput($event)"
      (blur)="onBlur()"
      (focus)="onFocus()"
      (keydown)="onKeyDown($event)"
      [attr.inputmode]="inputMode()"
      [disabled]="isDisabled"
      class="w-full h-full px-3 pr-16 bg-transparent outline-none text-gray-900"
    />

    <!-- DISPLAY FORMATEADO (overlay elegante) -->
    @if (!isFocused()) {
      <div class="absolute inset-y-0 right-10 flex items-center pr-2
                  text-gray-400 text-sm pointer-events-none tabular-nums">
        {{ displayValue() | decimalSeparator:locale():2:maxDecimals() }}
      </div>
    }

    <!-- SUFFIX -->
    @if (getSuffix()) {
      <div class="absolute inset-y-0 right-2 flex items-center
                  text-gray-500 text-sm pointer-events-none">
        {{ getSuffix() }}
      </div>
    }

    <!-- STEP -->
    @if (mode() === 'step') {
      <div class="absolute right-0 top-0 h-full w-6 flex flex-col border-l">
        <button
          type="button"
          (click)="increment()"
          class="flex-1 text-[10px] text-gray-400 hover:bg-gray-100"
        >
          ▲
        </button>
        <button
          type="button"
          (click)="decrement()"
          class="flex-1 text-[10px] text-gray-400 hover:bg-gray-100 border-t"
        >
          ▼
        </button>
      </div>
    }

  </div>
</div>
