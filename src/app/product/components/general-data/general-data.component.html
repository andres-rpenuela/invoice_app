
  <div [formGroup]="group">
    <div class="mb-4">
      <label class="block mb-1">Nombre</label>
      <input formControlName="name" class="input input-bordered w-full h-10 text-base" />
    </div>
  </div>

  <!-- Debug: Mostrar valor actual del campo 'name' -->
  @if( onDebug ){
    <div class="mt-2 p-2 bg-base-200 rounded">
      <strong>Valor actual (hijo):</strong> {{ group.get('name')?.value }}
    </div>
  }
